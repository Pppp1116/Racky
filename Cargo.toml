[package]
name = "Racky"
version = "0.1.0"
edition = "2024"

[dependencies]
smallvec = "1.16.5"
smithay = { git = "https://github.com/Smithay/smithay", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
    "desktop",
] }
thiserror = "2.0.21"
tracing = {version = "0.1.44", features = ["release_max_level_info"]}
tracing-subscriber = "0.3.23"
constructor_derive = {path = "./constructor_derive"}
serde = { version = "1.0.229", features = ["derive"] }
serde-kdl2 = "0.1.0"
dirs = "7.0.0"
vstd = "0.0.0-2026-11-08-0256"


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Performance-related checks
large_stack_arrays = "warn"
large_const_arrays = "warn"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = {
level = "warn",
check-cfg = ['cfg(verus_only)']
}
