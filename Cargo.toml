[package]
name = "Racky"
version = "0.1.0"
edition = "2024"

[dependencies]
smallvec = "1.16.5"
smithay = { git = "https://github.com/Smithay/smithay", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
    "desktop",
] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Performance-related checks
large_stack_arrays = "warn"
large_const_arrays = "warn"
